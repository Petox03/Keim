name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: build + vet + fmt + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        # gofmt -l lista los archivos con formato incorrecto. Si la salida no
        # está vacía, el step falla. Es la verificación canónica exigida por
        # AGENTS.md ("Todo el código generado debe cumplir con gofmt").
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Archivos sin formatear con gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./... -v
